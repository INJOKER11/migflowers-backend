server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;

    # Docker's embedded DNS. With the upstream in a variable, nginx looks
    # `app` up per request (cached 10s) instead of once at start. A literal
    # `fastcgi_pass app:9000` pinned the IP of the container that existed
    # when nginx started: a deploy that recreated the app container left
    # nginx sending every request to the old address — 502 on the whole API.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    client_max_body_size 40M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
